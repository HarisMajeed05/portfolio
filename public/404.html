<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#07080b" />
    <title>Not found | Haris Majeed Raja</title>
    <link rel="icon" type="image/svg+xml" href="/portfolio/favicon.svg" />
    <style>
      html { background: #07080b; color: #ece8df; font: 16px/1.5 ui-monospace, "SFMono-Regular", Menlo, monospace; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      .box { position: relative; padding: 40px clamp(24px, 6vw, 56px); border: 1px solid rgba(236, 232, 223, 0.18); max-width: 520px; }
      .box::before, .box::after { content: ""; position: absolute; width: 18px; height: 18px; border: 2px solid #ff5b2e; }
      .box::before { left: -1px; top: -1px; border-width: 2px 0 0 2px; }
      .box::after { right: -1px; bottom: -1px; border-width: 0 2px 2px 0; }
      .tag { display: inline-block; background: #ff5b2e; color: #07080b; padding: 3px 8px; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; }
      h1 { font: 400 clamp(40px, 9vw, 72px)/1 Georgia, serif; margin: 18px 0 12px; letter-spacing: -0.02em; }
      p { color: rgba(236, 232, 223, 0.66); margin: 0 0 26px; }
      a { color: #07080b; background: #ece8df; text-decoration: none; padding: 12px 18px; display: inline-block; letter-spacing: 0.1em; text-transform: uppercase; font-size: 12px; }
      a:hover { background: #ff5b2e; }
    </style>
  </head>
  <body>
    <main class="box">
      <span class="tag">no detection · 404</span>
      <h1>Nothing here.</h1>
      <p>The model looked hard and found no page at this address.</p>
      <a href="/portfolio/">Back to the portfolio</a>
    </main>
  </body>
</html>
