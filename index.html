    <script>
      // I pick the version before anything paints. Search engines, ?view=plain and
      // browsers that draw WebGL in software (no graphics chip, so the 3D scene would
      // freeze them) keep the fast plain page. ?view=3d forces the 3D site.
      (function () {
        var v = new URLSearchParams(location.search).get("view");
        var gl = null;
        var r = "";
        try {
          var c = document.createElement("canvas");
          // failIfMajorPerformanceCaveat: the browser itself says no when WebGL would run in software,
          // unless someone asked for the 3D site anyway
          gl = c.getContext("webgl", { failIfMajorPerformanceCaveat: v !== "3d", antialias: false, depth: false });
          if (gl) {
            r = String(gl.getParameter(gl.RENDERER));
            var e = gl.getExtension("WEBGL_debug_renderer_info");
            if (e) r += " " + gl.getParameter(e.UNMASKED_RENDERER_WEBGL);
            var k = gl.getExtension("WEBGL_lose_context");
            if (k) k.loseContext();
          }
        } catch (x) {}
        var bot = /bot|crawl|spider|slurp|preview|facebookexternalhit|google-inspectiontool/i.test(navigator.userAgent);
        var soft = /swiftshader|llvmpipe|softpipe|software|basic render/i.test(r);
        var three = !!gl && (v === "3d" || (v !== "plain" && !bot && !soft));
        document.documentElement.className = three ? "x3d" : "plain";
        try {
          var hot = localStorage.getItem("hmr-hot");
          if (hot) document.documentElement.style.setProperty("--hot", hot);
        } catch (x) {}
      })();
    </script>
